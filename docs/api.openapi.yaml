openapi: 3.1.0
info:
  title: FIL API
  version: 0.1.0
  description: Franchise Intelligence Layer — per-client CRM API
servers:
  - url: /api
paths:
  /health:
    get:
      summary: API health check
      responses:
        '200':
          description: OK
  /v1/session:
    post:
      summary: Create session (login)
    get:
      summary: Current session
    delete:
      summary: Destroy session (logout)
  /v1/profile:
    get:
      summary: Current user profile
    patch:
      summary: Update current user profile (name, email, phone, optional password)
  /v1/fields:
    get:
      summary: Field schema for entity (staff; fields.view)
    post:
      summary: Create a configurable field (admin; fields.manage)
  /v1/fields/{field}:
    patch:
      summary: Update a configurable field (admin; fields.manage)
    delete:
      summary: Delete a configurable field (admin; fields.manage)
  /v1/fields/reorder:
    post:
      summary: Reorder fields / move between groups (admin; fields.manage)
  /v1/fields/relatable-entities:
    get:
      summary: Field type catalogue + whitelisted relational target entities
  /v1/field-groups:
    get:
      summary: Field groups with their fields (admin tree)
      parameters:
        - name: entity
          in: query
          schema:
            type: string
        - name: context
          in: query
          schema:
            type: string
            enum: [widget]
          description: When widget, only groups allowed on embed forms (Application + User)
    post:
      summary: Create a field group (admin; fields.manage)
  /v1/field-groups/{fieldGroup}:
    patch:
      summary: Update a field group (admin; fields.manage)
    delete:
      summary: Delete a field group (admin; fields.manage)
  /v1/widget-forms:
    get:
      summary: List embeddable widget forms (admin; fields.manage)
    post:
      summary: Create a widget form (admin; fields.manage)
  /v1/widget-forms/{widgetForm}:
    get:
      summary: Show a widget form with its ordered fields
    patch:
      summary: Update a widget form (name, site_key, status, settings)
  /v1/widget-forms/{widgetForm}/fields:
    put:
      summary: Sync widget form fields (add/remove/reorder in one call)
  /v1/widget-forms/{widgetForm}/rotate-site-key:
    post:
      summary: Rotate the publishable site key for an embed form (admin; fields.manage)
  /public/v1/form-config:
    get:
      summary: Embeddable lead form field schema (resolved from active widget form)
  /public/v1/leads:
    post:
      summary: Public lead intake (widget)
  /portal/v1/session:
    post:
      summary: Prospect portal login
    get:
      summary: Current prospect session
    delete:
      summary: Prospect portal logout
  /portal/v1/setup-password:
    post:
      summary: Set prospect password from widget setup token
  /portal/v1/application:
    get:
      summary: Prospect long-form application schema + values
    patch:
      summary: Save prospect long-form field values
  /portal/v1/fdd-deliveries:
    get:
      summary: FDD deliveries for prospect (Item 23 signing)
  /portal/v1/fdd-deliveries/{fddDelivery}/sign-session:
    post:
      summary: Begin e-sign session for FDD delivery
  /portal/v1/fdd-deliveries/{fddDelivery}/sign:
    post:
      summary: Complete FDD Item 23 signature (local or vendor)
  /webhooks/esign:
    post:
      summary: E-sign vendor webhook (Dropbox Sign)
  /v1/stores/{store}/opening-checklist:
    get:
      summary: Store opening checklist + build-out timeline
    patch:
      summary: Update opening checklist items and timeline dates
  /v1/leads/{lead}/notes:
    get:
      summary: Corp notes on a lead
    post:
      summary: Add corp note to a lead
  /v1/stores/{store}/notes:
    get:
      summary: Corp notes on a store
    post:
      summary: Add corp note to a store
  /v1/contacts/{contact}/notes:
    get:
      summary: Corp notes on a contact
    post:
      summary: Add corp note to a contact
  /v1/entity-notes/{entityNote}:
    patch:
      summary: Update a corp note
    delete:
      summary: Delete a corp note
  /v1/todos:
    get:
      summary: Staff corp todos
    post:
      summary: Create staff todo
  /v1/todos/{staffTodo}:
    patch:
      summary: Update staff todo
    delete:
      summary: Delete staff todo
  /v1/query/{resource}:
    post:
      summary: Grid rows + aggregations (Postgres; ES-compatible aggregations shape)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [leads, stores, contacts, areas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQueryRequest'
      responses:
        '200':
          description: Rows and/or aggregation buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridQueryResponse'
  /v1/contacts/{contact}:
    get:
      summary: Contact detail (staff user with roles; contacts.view)
      parameters:
        - name: contact
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contact profile
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      summary: Update contact custom fields (contacts.manage)
      parameters:
        - name: contact
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated contact profile
        '403':
          description: Forbidden
        '404':
          description: Not found
  /v1/closings/export:
    get:
      summary: Export closings and fee lines as CSV (leads.view; scoped)
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json]
      responses:
        '200':
          description: CSV or JSON export
        '403':
          description: Forbidden
  /v1/closings:
    get:
      summary: List closings (leads.view; scoped)
      responses:
        '200':
          description: Closing list
        '403':
          description: Forbidden
  /v1/closings/{closing}:
    get:
      summary: Closing detail
      parameters:
        - name: closing
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Closing profile with workflow metadata
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      summary: Update closing status and fee lines (leads.manage)
      parameters:
        - name: closing
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                fee_lines:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      amount_cents:
                        type: integer
      responses:
        '200':
          description: Updated closing
        '403':
          description: Forbidden
        '422':
          description: Invalid transition or payload
  /public/v1/branding:
    get:
      summary: "Public V1 Branding"
  /v1/ach-transfers/reconciliation:
    get:
      summary: "V1 Ach Transfers Reconciliation"
  /v1/ach-transfers:
    get:
      summary: "V1 Ach Transfers Index"
  /v1/ach-transfers/{achTransfer}:
    get:
      summary: "V1 Ach Transfers Show"
  /v1/activity:
    get:
      summary: "V1 Activity Index"
  /v1/activity/page-views:
    post:
      summary: "V1 Activity Page Views Store"
  /v1/activity/export:
    get:
      summary: "V1 Activity Export"
  /v1/activity/subjects/{type}/{id}:
    get:
      summary: "V1 Activity Subjects"
  /v1/ai/threads:
    get:
      summary: "V1 Ai Threads Index"
    post:
      summary: "V1 Ai Threads Store"
  /v1/ai/threads/{aiThread}:
    get:
      summary: "V1 Ai Threads Show"
  /v1/ai/threads/{aiThread}/messages:
    post:
      summary: "V1 Ai Threads Messages"
  /v1/ai/threads/{aiThread}/stream:
    post:
      summary: "V1 Ai Threads Stream"
  /v1/app-config:
    get:
      summary: "V1 App Config"
  /v1/areas:
    get:
      summary: "V1 Areas Index"
  /v1/interest-regions:
    get:
      summary: "V1 Interest Regions Index"
    post:
      summary: "V1 Interest Regions Store"
  /v1/interest-regions/{interestRegion}:
    patch:
      summary: "V1 Interest Regions Update"
    delete:
      summary: "V1 Interest Regions Destroy"
  /v1/areas/{area}/fdd-availability:
    get:
      summary: "V1 Areas Fdd Availability"
  /v1/communications:
    get:
      summary: "V1 Communications Index"
    post:
      summary: "V1 Communications Store"
  /v1/dashboard:
    get:
      summary: "V1 Dashboard"
  /v1/documents:
    get:
      summary: "V1 Documents Index"
  /v1/documents/export/start:
    post:
      summary: "V1 Documents Export Start"
  /v1/documents/export/status:
    get:
      summary: "V1 Documents Export Status"
  /v1/documents/rows:
    get:
      summary: "V1 Documents Rows"
  /v1/documents/settings:
    get:
      summary: "V1 Documents Settings"
  /v1/documents/{document}:
    get:
      summary: "V1 Documents Show"
  /v1/documents/{document}/download:
    get:
      summary: "V1 Documents Download"
  /v1/drip-campaigns:
    get:
      summary: "V1 Drip Campaigns Index"
    post:
