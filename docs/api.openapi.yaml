components:
  schemas:
    GridQueryRequest:
      type: object
      properties:
        search:
          type: string
        filters:
          type: object
          additionalProperties: true
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                type: string
                enum: [asc, desc]
        cursor:
          type: string
          nullable: true
        limit:
          type: integer
          default: 50
        size:
          type: integer
          description: Legacy alias; 0 = aggregation-only (no rows)
        include_aggregations:
          type: boolean
          default: true
        aggregations:
          type: array
          description: Facet keys to compute; defaults per resource if omitted
          items:
            type: string
            example: meta.lead_status
    AggBucket:
      type: object
      properties:
        key:
          oneOf:
            - type: string
            - type: number
        doc_count:
          type: integer
    AggBranch:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AggBucket'
    GridQueryResponse:
      type: object
      properties:
        hits:
          type: object
          properties:
            total:
              type: object
              properties:
                value:
                  type: integer
            hits:
              type: array
              items:
                type: object
        aggregations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AggBranch'
        data:
          type: array
          description: Simplified row alias for new clients
        meta:
          type: object
          properties:
            total:
              type: integer
            next_cursor:
              type: string
              nullable: true
