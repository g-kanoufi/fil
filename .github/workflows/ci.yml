name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: ./vendor/bin/pint --test
      - run: php artisan test --compact
      - run: php artisan openapi:audit --fail-on-drift
      # Fails the build on any known advisory. Temporarily accept one via
      # `composer config audit.ignore.<CVE> "<reason>"` (see docs/SECURITY_AUDIT.md).
      - run: composer audit --no-dev

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      # Fails the build on high/critical advisories. Resolve by upgrading; if a
      # transitive advisory must be temporarily accepted, document it in the PR.
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: bash scripts/e2e-smoke.sh
